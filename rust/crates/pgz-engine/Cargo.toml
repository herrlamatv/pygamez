[package]
name = "pgz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine von PyGameZ auf rustgame: pygame-Fassade, ui.py, audio.py, game_base.py"

[dependencies]
# chrono: charts.rs (Kalender-Heatmap des Fortschritt-Bildschirms)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pgz-core = { workspace = true }
rustgame-core = { workspace = true }
rustgame-font = { workspace = true }
rustgame-mixer = { workspace = true }
rustgame-math = { workspace = true }
serde_json = { workspace = true }
