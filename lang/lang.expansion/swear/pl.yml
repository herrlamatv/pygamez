- \b([s5$]+[^\sa-zA-Z]*p+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*[l1|]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*j+)(?=[^\s]*\b)
