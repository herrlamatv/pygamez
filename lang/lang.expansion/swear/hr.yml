# Wortfilter - Hrvatski (hr)
# ===========================================================================
# Je Eintrag zwei Zeilen: zuerst das Regex-Muster (- ...), darunter das
# gemeinte Wort als Kommentar (# ...). Geprüft wird ohne Rücksicht auf
# Groß-/Kleinschreibung; ungültige Muster werden still übersprungen.
#
# Die Muster halten eingestreute Sonderzeichen und Ziffern aus
# ([^\sa-zA-Z]* - bewusst OHNE Leerzeichen, sonst liefe ein Muster über
# Wortgrenzen hinweg; nur zwischen zwei Wörtern sind Leerzeichen erlaubt),
# erlauben Buchstabenwiederholung (f+) und die üblichen Leetspeak-Ersetzungen
# ([a4@], [e3], [i1!|], [o0], [s5$] ...). Vor dem Vergleich entfernt
# swear._norm Akzente und macht aus "-" und "_" Leerzeichen - deshalb stehen
# die Wörter hier in ASCII-Schreibweise.
#
# Geprüft werden Map-Name, Map-ID und Creator-Name (siehe swear.py, ugc.py).
# Bearbeitet wird die Liste einfach hier: eine Regex-Zeile, darunter das Wort.

- \b(j+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[b8]+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*m+)\b
# jebem
- \b(j+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[b8]+[^\sa-zA-Z]*[i1!|]+)\b
# jebi
- \b(p+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[z2]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[a4@]+)\b
# pizda
- \b(k+[^\sa-zA-Z]*u+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*c+)\b
# kurac
- \b(k+[^\sa-zA-Z]*u+[^\sa-zA-Z]*r+[^\sa-zA-Z]*v+[^\sa-zA-Z]*[a4@]+)\b
# kurva
- \b([s5$]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*n+[^\sa-zA-Z]*j+[^\sa-zA-Z]*[e3]+)(?=[^\s]*\b)
# sranje
- \b([g9]+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*v+[^\sa-zA-Z]*n+[^\sa-zA-Z]*[o0]+)\b
# govno
- \b([s5$]+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*n+[^\sa-zA-Z]*j+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# seronja
- \b(p+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*k+[^\sa-zA-Z]*[a4@]+)\b
# picka
- \b(d+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[b8]+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[l1|]+)\b
# debil
- \b([i1!|]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*[t7+]+)\b
# idiot
- \b(k+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*n+)\b
# kreten
- \b(c+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[g9]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*n+)\b
# cigan
- \b(c+[^\sa-zA-Z]*r+[^\sa-zA-Z]*n+[^\sa-zA-Z]*j+[^\sa-zA-Z]*[o0]+)\b
# crnjo
- \b(n+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[s5$]+[^\sa-zA-Z]*[t7+]+)(?=[^\s]*\b)
# nacist
- \b(h+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[l1|]+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*r+)(?=[^\s]*\b)
# hitler
- \b([s5$]+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[l1|]+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*v+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*n+[^\sa-zA-Z]*j+[^\sa-zA-Z]*[e3]+)(?=[^\s]*\b)
# silovanje
- \b(p+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*r+)\b
# peder
- \b(d+[^\sa-zA-Z]*r+[^\sa-zA-Z]*k+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[z2]+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*j+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# drkadzija
- \b([g9]+[^\sa-zA-Z]*u+[^\sa-zA-Z]*[z2]+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# guzica
- \b([s5$]+[^\sa-zA-Z]*u+[^\sa-zA-Z]*p+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*k+)\b
# supak
- \b(k+[^\sa-zA-Z]*u+[^\sa-zA-Z]*j+[^\sa-zA-Z]*[a4@]+)\b
# kuja
- \b([b8]+[^\sa-zA-Z]*u+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*[l1|]+[^\sa-zA-Z]*[a4@]+)\b
# budala
- \b(j+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[b8]+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[e3]+)(?=[^\s]*\b)
# jebote
- \b(m+[^\sa-zA-Z]*r+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*n+[^\sa-zA-Z]*[a4@]+)\b
# mrcina
- \b([s5$]+[^\sa-zA-Z]*m+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*d+)\b
# smrad
- \b(k+[^\sa-zA-Z]*u+[^\sa-zA-Z]*r+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*n+[^\sa-zA-Z]*[a4@]+)\b
# kurcina
- \b(p+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[z2]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*u+[^\sa-zA-Z]*n+)\b
# pizdun
- \b([g9]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*d+)\b
# gad
- \b(d+[^\sa-zA-Z]*r+[^\sa-zA-Z]*k+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[i1!|]+)\b
# drkati
