# Wortfilter - Cestina (cs)
# ===========================================================================
# Je Eintrag zwei Zeilen: zuerst das Regex-Muster (- ...), darunter das
# gemeinte Wort als Kommentar (# ...). Geprüft wird ohne Rücksicht auf
# Groß-/Kleinschreibung; ungültige Muster werden still übersprungen.
#
# Die Muster halten eingestreute Sonderzeichen und Ziffern aus
# ([^\sa-zA-Z]* - bewusst OHNE Leerzeichen, sonst liefe ein Muster über
# Wortgrenzen hinweg; nur zwischen zwei Wörtern sind Leerzeichen erlaubt),
# erlauben Buchstabenwiederholung (f+) und die üblichen Leetspeak-Ersetzungen
# ([a4@], [e3], [i1!|], [o0], [s5$] ...). Vor dem Vergleich entfernt
# swear._norm Akzente und macht aus "-" und "_" Leerzeichen - deshalb stehen
# die Wörter hier in ASCII-Schreibweise.
#
# Geprüft werden Map-Name, Map-ID und Creator-Name (siehe swear.py, ugc.py).
# Bearbeitet wird die Liste einfach hier: eine Regex-Zeile, darunter das Wort.

- \b(k+[^\sa-zA-Z]*u+[^\sa-zA-Z]*r+[^\sa-zA-Z]*v+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# kurva
- \b(p+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[a4@]+)\b
# pica
- \b(h+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*v+[^\sa-zA-Z]*n+[^\sa-zA-Z]*[o0]+)(?=[^\s]*\b)
