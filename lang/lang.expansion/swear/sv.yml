- \b(k+[^\sa-zA-Z]*u+[^\sa-zA-Z]*k+[^\sa-zA-Z]*h+[^\sa-zA-Z]*u+[^\sa-zA-Z]*v+[^\sa-zA-Z]*u+[^\sa-zA-Z]*d+)(?=[^\s]*\b)
# kukhuvud
- \b([s5$]+[^\sa-zA-Z]*n+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*u+[^\sa-zA-Z]*n+[^\sa-zA-Z]*[g9]+[^\sa-zA-Z]*[e3]+)\b
# snorunge
- \b(d+[^\sa-zA-Z]*u+[^\sa-zA-Z]*m+[^\sa-zA-Z]*h+[^\sa-zA-Z]*u+[^\sa-zA-Z]*v+[^\sa-zA-Z]*u+[^\sa-zA-Z]*d+)\b
# dumhuvud
- \b(f+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[g9]+)\b
# fittig
