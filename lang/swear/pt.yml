# Wortfilter - Portugues (pt)
# ===========================================================================
# Je Eintrag zwei Zeilen: zuerst das Regex-Muster (- ...), darunter das
# gemeinte Wort als Kommentar (# ...). Geprüft wird ohne Rücksicht auf
# Groß-/Kleinschreibung; ungültige Muster werden still übersprungen.
#
# Die Muster halten eingestreute Sonderzeichen und Ziffern aus
# ([^\sa-zA-Z]* - bewusst OHNE Leerzeichen, sonst liefe ein Muster über
# Wortgrenzen hinweg; nur zwischen zwei Wörtern sind Leerzeichen erlaubt),
# erlauben Buchstabenwiederholung (f+) und die üblichen Leetspeak-Ersetzungen
# ([a4@], [e3], [i1!|], [o0], [s5$] ...). Vor dem Vergleich entfernt
# swear._norm Akzente und macht aus "-" und "_" Leerzeichen - deshalb stehen
# die Wörter hier in ASCII-Schreibweise.
#
# Geprüft werden Map-Name, Map-ID und Creator-Name (siehe swear.py, ugc.py).
# Bearbeitet wird die Liste einfach hier: eine Regex-Zeile, darunter das Wort.

- \b(m+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# merda
- \b(c+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*[l1|]+[^\sa-zA-Z]*h+[^\sa-zA-Z]*[o0]+)(?=[^\s]*\b)
# caralho
- \b(f+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[a4@]+)\b
# foda
- \b(f+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*r+)(?=[^\s]*\b)
# foder
- \b(p+[^\sa-zA-Z]*u+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+)\b
# puta
- \b(p+[^\sa-zA-Z]*u+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[o0]+)\b
# puto
- \b(c+[^\sa-zA-Z]*u+)\b
# cu
- \b([b8]+[^\sa-zA-Z]*u+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# buceta
- \b(v+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[o0]+)\b
# viado
- \b(c+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*n+[^\sa-zA-Z]*[o0]+)\b
# corno
- \b(f+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[l1|]+[^\sa-zA-Z]*h+[^\sa-zA-Z]*[o0]+[\W\d_]*d+[^\sa-zA-Z]*[a4@]+[\W\d_]*p+[^\sa-zA-Z]*u+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# filho da puta
- \b(p+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[a4@]+)\b
# porra
- \b(c+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[e3]+)(?=[^\s]*\b)
# cacete
- \b([o0]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[o0]+)(?=[^\s]*\b)
# otario
- \b(r+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[o0]+)(?=[^\s]*\b)
# retardado
- \b(n+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*[z2]+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[s5$]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# nazista
- \b(h+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[l1|]+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*r+)(?=[^\s]*\b)
# hitler
- \b([e3]+[^\sa-zA-Z]*[s5$]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*u+[^\sa-zA-Z]*p+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[o0]+)(?=[^\s]*\b)
# estupro
- \b([a4@]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*m+[^\sa-zA-Z]*[b8]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[o0]+)(?=[^\s]*\b)
# arrombado
- \b(d+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[s5$]+[^\sa-zA-Z]*[g9]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[o0]+)(?=[^\s]*\b)
# desgracado
- \b(v+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*[g9]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*[b8]+[^\sa-zA-Z]*u+[^\sa-zA-Z]*n+[^\sa-zA-Z]*d+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# vagabunda
- \b(p+[^\sa-zA-Z]*[i1!|]+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# piroca
- \b(x+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*x+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# xoxota
- \b([b8]+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# boceta
- \b(p+[^\sa-zA-Z]*u+[^\sa-zA-Z]*n+[^\sa-zA-Z]*h+[^\sa-zA-Z]*[e3]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# punheta
- \b([e3]+[^\sa-zA-Z]*[s5$]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*r+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[o0]+)(?=[^\s]*\b)
# escroto
- \b([b8]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*[b8]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*c+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# babaca
- \b(p+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*u+[\W\d_]*n+[^\sa-zA-Z]*[o0]+[\W\d_]*c+[^\sa-zA-Z]*u+)\b
# pau no cu
- \b(c+[^\sa-zA-Z]*h+[^\sa-zA-Z]*u+[^\sa-zA-Z]*p+[^\sa-zA-Z]*[a4@]+[\W\d_]*r+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*[l1|]+[^\sa-zA-Z]*[a4@]+)(?=[^\s]*\b)
# chupa rola
- \b([b8]+[^\sa-zA-Z]*[o0]+[^\sa-zA-Z]*[s5$]+[^\sa-zA-Z]*[t7+]+[^\sa-zA-Z]*[a4@]+)\b
# bosta
- \b(c+[^\sa-zA-Z]*u+[^\sa-zA-Z]*[z2]+[^\sa-zA-Z]*[a4@]+[^\sa-zA-Z]*[o0]+)(?=[^\s]*\b)
# cuzao
