<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SMOKE RUNNING</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 12px Consolas, monospace; }
  canvas { display: block; width: 800px; height: 600px; }
  pre { margin: 0; padding: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<pre id="result">running</pre>
<script src="../js/lang/de.js"></script>
<script src="../js/lang/en.js"></script>
<!-- alle Sprachen, damit --lang <code> wirklich umschaltet (vorher nur de/en) -->
<script src="../js/lang/fr.js"></script>
<script src="../js/lang/es.js"></script>
<script src="../js/lang/pt.js"></script>
<script src="../js/lang/pl.js"></script>
<script src="../js/lang/tr.js"></script>
<script src="../js/lang/da.js"></script>
<script src="../js/lang/no.js"></script>
<script src="../js/lang/sv.js"></script>
<script src="../js/lang/fi.js"></script>
<script src="../js/lang/cs.js"></script>
<script src="../js/lang/sl.js"></script>
<script src="../js/lang/hr.js"></script>
<script src="../js/wiki/de.js"></script>
<script src="../js/core/util.js"></script>
<script src="../js/core/ui.js"></script>
<script src="../js/core/audio.js"></script>
<script src="../js/core/game.js"></script>
<script src="../js/manifest.js"></script>
<script>
/*
 * Smoke-Test für ein Spiel (headless Chrome, siehe tools/smoke.js).
 * Parameter: game=<id>, mode=<mode>, frames=<n>, idle=1, keys=<skript>, seed=<n>, lang=<code>
 * Das Ergebnis steht als JSON in <pre id="result">.
 */
(function () {
  "use strict";
  const q = new URLSearchParams(location.search);
  const gameId = q.get("game");
  const frames = Number(q.get("frames") || 900);
  const idle = q.get("idle") === "1";
  const script = q.get("keys");
  // Zeitschritt je Frame (Standard 1/60 wie die App). Mit dt=0.00694 (144 Hz)
  // lassen sich Spiele prüfen, deren Logik vom Frame-Takt abhängt.
  const DT = Number(q.get("dt")) > 0 ? Number(q.get("dt")) : 1 / 60;
  if (q.get("lang")) PG.lang = q.get("lang");
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  PG.app = { pixelScale: 1, cssScale: 1, canvas, ctx, resetTransform(c) { (c || ctx).setTransform(1, 0, 0, 1, 0, 0); } };
  const errors = [];
  const out = { game: gameId, modes: [], errors };
  window.addEventListener("error", (e) => errors.push({ where: "window", message: String(e.message), stack: e.error && e.error.stack }));

  function finish() {
    document.getElementById("result").textContent = JSON.stringify(out, null, 1);
    document.title = errors.length ? "SMOKE FAIL" : "SMOKE OK";
  }

  const entry = (window.PG_MANIFEST || []).find((m) => m.id === gameId);
  if (!entry) {
    errors.push({ where: "manifest", message: "unknown game " + gameId });
    return finish();
  }
  let fi = 0;
  const loadNext = () => {
    if (fi >= entry.files.length) return run();
    const s = document.createElement("script");
    s.src = "../" + entry.files[fi++];
    s.onload = loadNext;
    s.onerror = () => {
      errors.push({ where: "load", message: "missing file " + s.src });
      loadNext();
    };
    document.body.appendChild(s);
  };
  loadNext();

  const KEYS = ["Up", "Down", "Left", "Right", "w", "a", "s", "d", "space", "Return", "1", "2", "3", "4", "5", "e", "q", "r", "f", "h", "p", "m", "g", "c", "x", "z", "Tab", "BackSpace", "plus", "minus", "Shift_L"];
  const rnd = new PG.Random(Number(q.get("seed") || 7));

  function parseScript(str) {
    // "Right,Right,Up@30,space,click:400:300,rclick:10:10,move:5:5,wheel:1,hold:Right:20"
    const steps = [];
    for (const raw of str.split(",").map((s) => s.trim()).filter(Boolean)) {
      let [tok, wait] = raw.split("@");
      steps.push({ tok, wait: wait ? Number(wait) : 2 });
    }
    return steps;
  }

  function run() {
    const reg = PG.gameById[gameId];
    if (!reg) {
      errors.push({ where: "register", message: "PG.register was not called for " + gameId });
      return finish();
    }
    let modes = reg.meta.modes && reg.meta.modes.length ? reg.meta.modes.map((m) => m[0]) : ["single"];
    if (q.get("mode")) modes = [q.get("mode")];
    out.meta = { key: reg.meta.key, name: PG.gameName(reg), modes };
    let mi = 0;
    const nextMode = () => {
      if (mi >= modes.length) return finish();
      runMode(reg, modes[mi++], nextMode);
    };
    nextMode();
  }

  function runMode(reg, mode, done) {
    const info = { mode, frames: 0, gameOvers: 0, maxScore: 0, errorCount: 0 };
    out.modes.push(info);
    let game;
    const err = (where, e) => {
      info.errorCount++;
      if (errors.length < 25) errors.push({ mode, where, frame: info.frames, message: String((e && e.message) || e), stack: e && e.stack ? String(e.stack).split("\n").slice(0, 6).join("\n") : "" });
    };
    try {
      game = new reg.cls(PG.W, PG.H, mode);
      game.ctx = ctx;
    } catch (e) {
      err("constructor", e);
      return done();
    }
    const steps = script ? parseScript(script) : null;
    let stepIdx = 0, waitLeft = 0;
    const held = new Set();
    const send = (e) => {
      try {
        if (!game.paused) game.handleEvent(Object.assign({ key: null, char: "", pos: null, button: 1, delta: 0, rel: null, repeat: false }, e));
      } catch (x) {
        err("handleEvent(" + e.kind + (e.key ? ":" + e.key : "") + ")", x);
      }
    };
    const pos = () => [rnd.randint(0, PG.W - 1), rnd.randint(0, PG.H - 1)];
    let wasOver = false;

    const chunk = () => {
      const end = Math.min(frames, info.frames + 30);
      for (; info.frames < end; info.frames++) {
        const dt = DT;
        if (steps) {
          if (waitLeft > 0) waitLeft--;
          else if (stepIdx < steps.length) {
            const { tok, wait } = steps[stepIdx++];
            waitLeft = wait;
            const parts = tok.split(":");
            if (parts[0] === "click" || parts[0] === "rclick") {
              const p = [Number(parts[1]), Number(parts[2])];
              const b = parts[0] === "click" ? 1 : 3;
              send({ kind: "mousemove", pos: p });
              send({ kind: "mousedown", pos: p, button: b });
              send({ kind: "mouseup", pos: p, button: b });
            } else if (parts[0] === "down") {
              send({ kind: "mousedown", pos: [Number(parts[1]), Number(parts[2])], button: 1 });
            } else if (parts[0] === "up") {
              send({ kind: "mouseup", pos: [Number(parts[1]), Number(parts[2])], button: 1 });
            } else if (parts[0] === "move") {
              send({ kind: "mousemove", pos: [Number(parts[1]), Number(parts[2])] });
            } else if (parts[0] === "rel") {
              send({ kind: "mouserel", rel: [Number(parts[1]), Number(parts[2])] });
            } else if (parts[0] === "wheel") {
              send({ kind: "wheel", pos: [400, 300], delta: Number(parts[1]) });
            } else if (parts[0] === "hold") {
              send({ kind: "keydown", key: parts[1], char: parts[1].length === 1 ? parts[1] : "" });
              waitLeft = Number(parts[2] || 20);
              held.add(parts[1]);
            } else if (parts[0] === "release") {
              send({ kind: "keyup", key: parts[1] });
              held.delete(parts[1]);
            } else if (parts[0] === "pause") {
              game.paused = !game.paused;
            } else {
              for (const h of held) send({ kind: "keyup", key: h });
              held.clear();
              send({ kind: "keydown", key: tok, char: tok.length === 1 ? tok : tok === "space" ? " " : "" });
              send({ kind: "keyup", key: tok });
            }
          }
        } else if (!idle) {
          const r = rnd.random();
          if (r < 0.18) {
            const k = rnd.choice(KEYS);
            send({ kind: "keydown", key: k, char: k.length === 1 ? k : "" });
            held.add(k);
          } else if (r < 0.3 && held.size) {
            const k = rnd.choice([...held]);
            held.delete(k);
            send({ kind: "keyup", key: k });
          } else if (r < 0.42) {
            send({ kind: "mousemove", pos: pos() });
          } else if (r < 0.5) {
            const p = pos();
            const b = rnd.random() < 0.8 ? 1 : 3;
            if (b === 1 || game.wantsRightClick) {
              send({ kind: "mousedown", pos: p, button: b });
              if (rnd.random() < 0.7) send({ kind: "mouseup", pos: [p[0] + rnd.randint(-40, 40), p[1] + rnd.randint(-40, 40)], button: b });
            }
          } else if (r < 0.53) {
            send({ kind: "mouseup", pos: pos(), button: 1 });
          } else if (r < 0.55) {
            send({ kind: "wheel", pos: pos(), delta: rnd.choice([1, -1]) });
          } else if (r < 0.6) {
            let cap = false;
            try { cap = game.captureMouse; } catch (e) { err("captureMouse", e); }
            if (cap) send({ kind: "mouserel", rel: [rnd.randint(-30, 30), rnd.randint(-20, 20)] });
          }
          if (game.gameOver && info.frames % 90 === 45) send({ kind: "keydown", key: "Return", char: "" });
          if (info.frames % 400 === 399 && !game.gameOver) {
            // Pause-Roundtrip wie ESC in der App
            let wantsEsc = false;
            try { wantsEsc = game.wantsEscape; } catch (e) { err("wantsEscape", e); }
            if (wantsEsc) send({ kind: "keydown", key: "Escape" });
          }
        }
        try {
          if (!game.paused && !game.gameOver) game.update(dt);
        } catch (e) {
          err("update", e);
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, PG.W, PG.H);
        ctx.save();
        try {
          game.draw(ctx);
        } catch (e) {
          err("draw", e);
        }
        ctx.restore();
        if (game.gameOver && !wasOver) info.gameOvers++;
        wasOver = game.gameOver;
        if (typeof game.score === "number" && game.score > info.maxScore) info.maxScore = game.score;
        if (typeof game.score !== "number" || !isFinite(game.score)) {
          if (!info.badScore) err("score", "score is not a finite number: " + game.score);
          info.badScore = true;
        }
      }
      if (info.frames < frames && info.errorCount < 40) setTimeout(chunk, 0);
      else {
        try { game.destroy(); } catch (e) { err("destroy", e); }
        done();
      }
    };
    chunk();
  }
})();
</script>
</body>
</html>
